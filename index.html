<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0C090B" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D6B36A' stroke-width='2'><path d='M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z'/><path d='M19 10v2a7 7 0 0 1-14 0v-2'/><line x1='12' x2='12' y1='19' y2='22'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MICRO MAX // Wireless Microphone & PA System</title>
    <meta name="description" content="MICRO MAX turns smartphones into ultra-low-latency wireless microphones for events, conferences, classrooms, and PA sound systems." />
    <!-- Suppress Netlify HUD / Powered-by watermark -->
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
      }
    </style>
    <script>
      try {
        localStorage.setItem("nl-hud:public:v1", "hidden");
        localStorage.setItem("nl-hud:owner-private:v1", "hidden");
      } catch (e) {}
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    </noscript>
  </head>
  <body class="bg-bg-main text-text-primary font-body antialiased selection:bg-gold selection:text-bg-main overflow-x-hidden min-h-screen">
    <!-- Guard to block Netlify HUD / Powered-by badge from mounting -->
    <div id="nl-badge-frame" style="display:none!important;" aria-hidden="true"></div>
    <div id="nl-hud-frame" style="display:none!important;" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
